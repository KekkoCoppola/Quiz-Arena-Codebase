<!doctype html>
<html lang="it" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #443be0;
        --ink: #1c1c26;
        --yellow: #ffe500;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24.6"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene: una per sotto-composizione, in fila sulla stessa corsia -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.6" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="logo" data-composition-id="logo" data-composition-src="compositions/logo.html"
        data-start="3.6" data-duration="2.0" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="flow" data-composition-id="flow" data-composition-src="compositions/flow.html"
        data-start="5.6" data-duration="12.5" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="podium" data-composition-id="podium" data-composition-src="compositions/podium.html"
        data-start="18.1" data-duration="3.5" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <!-- Il finale entra 0,3 s prima: un'iride gialla si apre sul podio -->
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="21.3" data-duration="3.3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- Musica: entra sul VIA! dal battere forte della traccia (16,02 s) -->
      <audio id="music" class="clip" src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3"
        data-start="3.1" data-duration="21.5" data-media-start="16.02" data-volume="0.4"
        data-fade-out="1.1" data-track-index="9"></audio>

      <!-- Effetti: quasi tutti dalla sala vera (resources/audio). Picco un fotogramma dopo l'immagine. -->
      <audio id="sfx-ready" class="clip" src="assets/sfx/countdown-ready-01.wav" data-start="0" data-duration="0.6" data-volume="1.6" data-track-index="5"></audio>
      <audio id="sfx-beep3" class="clip" src="assets/sfx/countdown-beep-01.wav" data-start="0.71" data-duration="0.28" data-volume="0.9" data-track-index="5"></audio>
      <audio id="sfx-beep2" class="clip" src="assets/sfx/countdown-beep-01.wav" data-start="1.54" data-duration="0.28" data-volume="0.9" data-track-index="5"></audio>
      <audio id="sfx-beep1" class="clip" src="assets/sfx/countdown-beep-01.wav" data-start="2.34" data-duration="0.28" data-volume="0.9" data-track-index="5"></audio>
      <audio id="sfx-go" class="clip" src="assets/sfx/countdown-go-01.wav" data-start="3.12" data-duration="1.1" data-volume="1.2" data-track-index="5"></audio>
      <audio id="sfx-logo" class="clip" src="assets/sfx/impactSoft_medium_001.ogg" data-start="3.63" data-duration="0.18" data-volume="0.7" data-track-index="6"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/sfx/avatar-land-01.wav" data-start="4.03" data-duration="0.12" data-volume="1.0" data-track-index="6"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/avatar-land-02.wav" data-start="4.38" data-duration="0.12" data-volume="1.0" data-track-index="6"></audio>
      <audio id="sfx-in" class="clip" src="assets/sfx/card-slide-1.ogg" data-start="5.5" data-duration="0.6" data-volume="0.55" data-track-index="6"></audio>
      <audio id="sfx-joined" class="clip" src="assets/sfx/player-joined-01.wav" data-start="8.2" data-duration="0.16" data-volume="3.5" data-track-index="6"></audio>
      <audio id="sfx-giusto" class="clip" src="assets/sfx/reveal-01.wav" data-start="12.17" data-duration="0.62" data-volume="1.3" data-track-index="6"></audio>
      <audio id="sfx-grow" class="clip" src="assets/sfx/card-slide-3.ogg" data-start="13.9" data-duration="0.6" data-volume="0.5" data-track-index="6"></audio>
      <audio id="sfx-swap1" class="clip" src="assets/sfx/swap-01.wav" data-start="16.75" data-duration="0.24" data-volume="1.3" data-track-index="6"></audio>
      <audio id="sfx-swap2" class="clip" src="assets/sfx/swap-02.wav" data-start="17.15" data-duration="0.2" data-volume="1.3" data-track-index="6"></audio>
      <audio id="sfx-swap3" class="clip" src="assets/sfx/swap-03.wav" data-start="17.55" data-duration="0.28" data-volume="1.3" data-track-index="6"></audio>
      <audio id="sfx-winner" class="clip" src="assets/sfx/winner-01.wav" data-start="19.85" data-duration="2.2" data-volume="1.0" data-track-index="7"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/impactBell_heavy_000.ogg" data-start="21.6" data-duration="1.48" data-volume="0.45" data-track-index="6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
